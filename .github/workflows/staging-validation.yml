name: VagasIO staging validation

on:
  push:
    branches:
      - 'staging/**'
  pull_request:
    branches:
      - 'staging/**'

jobs:
  static-and-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.4'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --check src/server.js
      - run: node --check src/auth.js
      - run: node --check src/audit.js
      - run: npm test --if-present
